services:
  api:
    build: .
    container_name: api_container
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build: .
    # NO container_name here, deliberately - a fixed name only allows ONE
    # instance. This service is the one meant to be scaled:
    #   docker compose up -d --scale worker=3
    # Job-processing capacity grows independently of the api container, with
    # no code changes - the whole point of putting Redis between them.
    command: python -m app.worker
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
    env_file:
      - .env  # OPENAI_API_KEY - only the worker ever calls OpenAI
    # The image's Dockerfile HEALTHCHECK assumes an HTTP server on :8000,
    # which only the api role runs - disable it here rather than have this
    # service report "unhealthy" forever for a check that doesn't apply to it.
    healthcheck:
      disable: true
    depends_on:
      redis:
        condition: service_healthy
      chromadb:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: redis_container
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  chromadb:
    image: chromadb/chroma:latest
    container_name: chromadb_container
    # No curl/wget/python in this image (checked directly) - bash's /dev/tcp
    # pseudo-device sends a raw HTTP request with no external binary needed.
    # /api/v1/heartbeat is gone (410) on current Chroma versions; v2 is current.
    # Must invoke bash explicitly, not CMD-SHELL - this image's /bin/sh is
    # dash, which doesn't support /dev/tcp (a bash-only extension).
    healthcheck:
      test:
        [
          "CMD",
          "bash",
          "-c",
          "exec 3<>/dev/tcp/localhost/8000 && printf 'GET /api/v2/heartbeat HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q 200",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - chroma_data:/chroma/chroma
    restart: unless-stopped

volumes:
  chroma_data:
