# CI/CD for the agent service: test -> build -> push -> deploy (canary) -> promote.
#
# GitHub runs workflows only from .github/workflows/ at the ROOT of a repository.
# This copy lives inside the course folder so it does not run on the course repo;
# to use it, make 5_ci_cd_cloud_deploy its own repository (or copy this file to
# your repo's root .github/workflows/ and keep the working-directory below).
#
# Repository settings it expects (Settings -> Secrets and variables -> Actions):
#   variables: DEPLOY_TARGET (gcp | aws), GCP_PROJECT, GCP_REGION, AWS_REGION
#   secrets  : GCP_WORKLOAD_IDENTITY_PROVIDER, GCP_SERVICE_ACCOUNT  (keyless login to GCP)
#              AWS_DEPLOY_ROLE_ARN                                   (keyless login to AWS)
# No cloud keys are stored in GitHub: both clouds trust GitHub's OIDC token instead.
name: agent-service-ci-cd

on:
  push:
    branches: [main]
  pull_request:

env:
  SERVICE: agent-service
  WORKDIR: 14_advanced/18_Dockerizing/5_ci_cd_cloud_deploy   # "." if this folder is the repo root

jobs:
  # ------------------------------------------------------------------ CI
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORKDIR }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pytest -q tests                 # fake LLM - no API key needed in CI
      - name: Image builds and starts
        run: |
          docker build -t "$SERVICE:ci" --build-arg APP_VERSION="${GITHUB_SHA::7}" .
          docker run -d --name smoke -p 8000:8000 "$SERVICE:ci"
          for i in $(seq 1 20); do curl -fs localhost:8000/ready && exit 0; sleep 1; done
          docker logs smoke; exit 1

  # ------------------------------------------------------- CD: Google Cloud Run
  deploy-cloud-run:
    needs: test
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_TARGET == 'gcp'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write                       # lets the job ask GitHub for an OIDC token
    defaults:
      run:
        working-directory: ${{ env.WORKDIR }}
    env:
      IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT }}/agents/agent-service:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Build and push to Artifact Registry
        run: |
          gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet
          docker build -t "$IMAGE" --build-arg APP_VERSION="${GITHUB_SHA::7}" .
          docker push "$IMAGE"
      - name: Deploy a new revision with NO traffic (tagged "canary")
        run: |
          gcloud run deploy "$SERVICE" --image "$IMAGE" --region ${{ vars.GCP_REGION }} \
            --set-secrets OPENAI_API_KEY=openai-api-key:latest \
            --min-instances 0 --max-instances 5 --concurrency 20 \
            --no-traffic --tag canary --quiet
      - name: Smoke-test the canary URL, then send it 10% of traffic
        run: |
          URL=$(gcloud run services describe "$SERVICE" --region ${{ vars.GCP_REGION }} \
                --format 'value(status.traffic.filter(tag=canary).url)' | head -1)
          curl -fs "$URL/ready"
          gcloud run services update-traffic "$SERVICE" --region ${{ vars.GCP_REGION }} --to-tags canary=10 --quiet

  promote-cloud-run:
    needs: deploy-cloud-run
    runs-on: ubuntu-latest
    environment: production                 # add required reviewers -> a human approves before 100%
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud run services update-traffic "$SERVICE" --region ${{ vars.GCP_REGION }} --to-latest --quiet

  # ------------------------------------------------------- CD: AWS ECS on Fargate
  deploy-ecs:
    needs: test
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_TARGET == 'aws'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: ${{ env.WORKDIR }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push to ECR
        id: image
        run: |
          IMAGE="${{ steps.ecr.outputs.registry }}/agent-service:${{ github.sha }}"
          docker build -t "$IMAGE" --build-arg APP_VERSION="${GITHUB_SHA::7}" .
          docker push "$IMAGE"
          echo "uri=$IMAGE" >> "$GITHUB_OUTPUT"
      - id: taskdef
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ env.WORKDIR }}/deploy/ecs-task-definition.json
          container-name: agent
          image: ${{ steps.image.outputs.uri }}
      - uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.taskdef.outputs.task-definition }}
          cluster: agents
          service: agent-service
          wait-for-service-stability: true   # rolling update; ECS rolls back if new tasks fail health checks
