# Blue/green on one laptop: two versions run side by side behind nginx.
#   docker compose up -d --build                  -> http://localhost:8028/version  ("blue-1.0")
#   .\switch.ps1 green     (or ./switch.sh green)  -> same URL now says "green-2.0", no downtime
#   .\switch.ps1 blue                              -> instant rollback
# Cloud equivalents: Cloud Run traffic split, ECS + CodeDeploy blue/green, a load balancer's target groups.
services:
  blue:
    build:
      context: ..
      args: { APP_VERSION: blue-1.0 }
  green:
    build:
      context: ..
      args: { APP_VERSION: green-2.0 }
  proxy:
    image: nginx:1.27-alpine
    ports:
      - "8028:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./active.conf:/etc/nginx/conf.d/active.conf:ro
    depends_on:
      blue: { condition: service_healthy }
      green: { condition: service_healthy }
