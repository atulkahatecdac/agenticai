# The load balancer for the blue/green demo. All traffic goes to whichever
# upstream active.conf names; switch.ps1 / switch.sh rewrites that file and
# reloads nginx - a reload starts new workers and lets the old ones finish
# their requests, so no request is dropped during the switch.
events {}
http {
    include /etc/nginx/conf.d/active.conf;      # defines upstream "live"
    server {
        listen 80;
        location / {
            proxy_pass http://live;
            add_header X-Served-By $upstream_addr always;
        }
    }
}
