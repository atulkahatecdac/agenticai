services:
  prometheus:
    image: prom/prometheus:latest
    container_name: securelife-prometheus
    ports:
      # Host port 9095, not Prometheus's default 9090: this repo's Langfuse demo
      # (9_general) runs a local MinIO container that also claims 9090, and Docker
      # fails that bind SILENTLY on some setups (`docker compose up -d` reports
      # success, but `docker port securelife-prometheus` shows no mapping at all) -
      # if you hit that, either free up 9090 or just keep using 9095 like this.
      - "9095:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    # The scrape target (17_3_prometheus_metrics_agent.py) runs on the HOST, not in
    # a container, since it needs .env / OpenAI access like every other script in
    # this repo. host.docker.internal is built into Docker Desktop (Windows/Mac);
    # this extra_hosts entry is what makes the same compose file also work
    # unmodified on Linux, where host.docker.internal isn't automatic.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: securelife-grafana
    ports:
      - "3000:3000"
    environment:
      # Demo-only credentials/anonymous access - fine for localhost, never for a
      # real deployment.
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    volumes:
      # Pre-provisions the Prometheus datasource AND the dashboard below, so the
      # dashboard is already there the first time you open Grafana - no manual
      # "add data source" / "import dashboard" clicking required.
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    restart: unless-stopped
